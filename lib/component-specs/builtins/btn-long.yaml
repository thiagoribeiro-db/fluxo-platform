id: btn-long
displayName: "Botão Longo (quick-reply largo)"
icon: "▭"
category: navigation
nodeType: btn-long
flowControl: linear

description: |
  Quick-reply button (interactive.button do Cloud API) renderizado com
  largura inteira no canvas. É funcionalmente IDÊNTICO ao Botão Curto —
  ambos viram `interactive.button` no WhatsApp. A diferença é só visual:
  btn-long é usado quando há UMA única opção/CTA, ocupando linha inteira;
  btn-short é usado em rows de 2-3 lado-a-lado.

  ⚠️ NÃO confundir com CTA URL Button (`cta_url`) — esse abre URL externa
  no navegador e é um componente separado (não implementado ainda).

  Limites WhatsApp Cloud API (válidos pra btn-long E btn-short):
    - label: até 20 chars
    - máximo 3 quick-replies por mensagem (soma curtos + longos)

detectionCues:
  - 'Lista com apenas 1 item após uma pergunta/instrução'
  - 'CTAs explícitos curtos: "Continuar", "Aceitar"'
  - 'Frase como "o usuário toca em Continuar pra avançar"'

usageRules:
  - 'Use APENAS quando há 1 ÚNICA opção/ação. Se houver 2-3, use `buttons`. Se 4+, use `menu`.'
  - 'O `label` é o texto exibido no botão — geralmente um verbo de ação curto'
  - 'Limite Meta: 20 chars no label (mesmo que btn-short, é o mesmo interactive.button)'
  - 'Pra link externo (URL no navegador), aguarde implementação do CTA URL — NÃO use btn-long pra isso'

fields:
  label:
    type: string
    required: true
    description: Texto do botão (quick-reply, até 20 chars)
    aiHint: 'Comece com verbo de ação curto: "Continuar", "Aceitar", "Sim". Máximo 20 chars (limite WhatsApp).'

builderRules:
  edgeFromPrevious: true
  updatesLastFlowId: true

examples:
  - description: Aceitar termos antes de continuar
    input: |
      Bot: Para continuar, é necessário aceitar nossos termos.
      - Aceitar termos
    output:
      - { kind: bot, text: "Para continuar, é necessário aceitar nossos termos." }
      - { kind: btn-long, label: "Aceitar termos" }

  - description: CTA único curto
    input: |
      Bot: Tudo pronto pra começar?
      - Iniciar atendimento
    output:
      - { kind: bot, text: "Tudo pronto pra começar?" }
      - { kind: btn-long, label: "Iniciar atendimento" }
