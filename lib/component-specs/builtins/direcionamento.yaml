id: direcionamento
displayName: "Direcionamento (Salto)"
icon: "↪"
category: navigation
nodeType: direcionamento
flowControl: leaf

description: |
  Salto/transição pra outro frame do fluxo. Renderiza como um botão verde
  CLICÁVEL no canvas — clicar leva o usuário pro frame destino.

  É a "cola" que conecta cenários. Após menus, geralmente cada opção tem
  um direcionamento correspondente.

detectionCues:
  - 'Frases "vai pra X", "direciona pra X", "salta pra X", "pula pra X"'
  - 'Após menu/buttons: cada opção geralmente tem um direcionamento implícito ou explícito'
  - 'Frases de continuidade: "voltar ao menu", "encerrar atendimento", "falar com atendente"'
  - 'Setas explícitas no texto: "Ofertas → frame Ofertas", "Atendente → Transbordo"'

usageRules:
  - 'O `target_frame_id` é o SLUG do frame destino — deve casar com o `frame_id` de algum frame na sua lista de frames'
  - 'Se o destino é um frame que ainda NÃO existe na sua lista, use um slug consistente: "atendente", "encerramento", "saudacao", "algo-mais"'
  - 'Após `menu`: emita UM direcionamento pra cada opção, em ordem'
  - 'Direcionamento é folha — NÃO atualiza o cursor de fluxo'

commonMistakes:
  - 'Esquecer de criar os direcionamentos pós-menu'
  - 'Usar `target_frame_id` que não casa com nenhum `frame_id` (links quebrados)'
  - 'Emitir direcionamento pra MESMO frame (loop infinito)'

fields:
  label:
    type: string
    required: true
    description: Texto exibido no botão de direcionamento
    aiHint: 'Geralmente o nome da opção de menu, ex: "Ofertas", "Falar com atendente", "Algo Mais"'
  target_frame_id:
    type: string
    required: true
    description: Slug do frame destino
    aiHint: 'Use o `frame_id` de outro frame. Slugs comuns: "saudacao", "algo-mais", "atendente", "encerramento"'

builderRules:
  edgeFromPrevious: true
  updatesLastFlowId: false  # folha

examples:
  - description: Direcionamentos pós-menu (um por opção)
    input: |
      Bot: Escolha uma opção:
      - Ofertas
      - Falar com atendente
    output:
      - { kind: bot, text: "Escolha uma opção:" }
      - { kind: menu, header: "Menu Principal", options: ["Ofertas", "Falar com atendente"] }
      - { kind: direcionamento, label: "Ofertas", target_frame_id: "ofertas" }
      - { kind: direcionamento, label: "Falar com atendente", target_frame_id: "atendente" }

  - description: Direcionamento implícito de continuidade
    input: 'Bot: Posso te ajudar com algo mais?'
    output:
      - { kind: bot, text: "Posso te ajudar com algo mais?" }
      - { kind: direcionamento, label: "Algo Mais", target_frame_id: "algo-mais" }

  - description: Transbordo pra atendente humano
    input: 'Esse caso vai pra atendimento humanizado.'
    output: { kind: direcionamento, label: "Falar com atendente", target_frame_id: "atendente" }
